version: '3.8'

services:
  # ========================================================================
  # PostgreSQL Database Service
  # ========================================================================
  postgres_db:
    image: postgres:15-alpine
    container_name: financial_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_db
    ports:
      - "5432:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Optional: Initialize database with schema
      # - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial_network
    restart: unless-stopped

  # ========================================================================
  # ETL Application Service
  # ========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_analytics_app
    environment:
      # Database connection
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/financial_db
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 10

      # Data paths (inside container)
      RAW_DATA_PATH: /app/data/raw/sample_transactions.csv
      PROCESSED_DATA_PATH: /app/data/processed/

      # Application settings
      LOG_LEVEL: INFO
      BATCH_SIZE: 5000
      ANOMALY_SCORE_THRESHOLD: 0.5
      ENVIRONMENT: production

      # Anomaly detection parameters
      ZSCORE_THRESHOLD: 3
      IQR_MULTIPLIER: 1.5
      HIGH_VALUE_THRESHOLD: 10000
      VELOCITY_THRESHOLD: 5
      VELOCITY_WINDOW_MINUTES: 60

      # Alert settings
      ALERT_HIGH_ANOMALY_THRESHOLD: 0.85
      SEND_ALERTS: "False"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      # Mount data directories for persistence and access
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - financial_network
    restart: unless-stopped
    # Optional: Run pipeline on schedule (requires restart policy)
    # command: bash -c "while true; do python src/main.py; sleep 3600; done"

  # ========================================================================
  # Optional: PgAdmin for Database Management (Uncomment to enable)
  # ========================================================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres_db
  #   networks:
  #     - financial_network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  financial_network:
    driver: bridge
